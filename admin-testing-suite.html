<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجموعة اختبار الأدمن | Admin Testing Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .testing-dashboard {
            padding: 30px;
        }

        .test-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .test-category {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .test-category:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .category-icon {
            font-size: 2em;
            margin-left: 15px;
        }

        .category-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
        }

        .test-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .test-item:last-child {
            border-bottom: none;
        }

        .test-name {
            font-weight: 500;
            color: #495057;
        }

        .test-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .test-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .test-btn.testing {
            background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
            cursor: not-allowed;
        }

        .test-btn.success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .test-btn.error {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
        }

        .results-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            border: 2px solid #e9ecef;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .clear-results {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-results:hover {
            background: #5a6268;
            transform: scale(1.05);
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 4px solid #28a745;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .result-item.error {
            border-right-color: #dc3545;
        }

        .result-timestamp {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .result-message {
            font-weight: 500;
            color: #333;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .run-all-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 30px;
        }

        .run-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .test-categories {
                grid-template-columns: 1fr;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 مجموعة اختبار الأدمن</h1>
            <p>Admin Testing Suite - Laravel Brive Platform</p>
        </div>

        <div class="testing-dashboard">
            <button class="run-all-btn" onclick="runAllTests()">🚀 تشغيل جميع الاختبارات | Run All Tests</button>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalTests">0</div>
                    <div class="stat-label">إجمالي الاختبارات | Total Tests</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="passedTests">0</div>
                    <div class="stat-label">نجح | Passed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="failedTests">0</div>
                    <div class="stat-label">فشل | Failed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="runningTests">0</div>
                    <div class="stat-label">قيد التشغيل | Running</div>
                </div>
            </div>

            <div class="test-categories" id="testCategories"></div>

            <div class="results-panel">
                <div class="results-header">
                    <div class="results-title">📊 نتائج الاختبار | Test Results</div>
                    <button class="clear-results" onclick="clearResults()">🗑️ مسح النتائج | Clear Results</button>
                </div>
                <div id="resultsContainer">
                    <p style="text-align: center; color: #6c757d; padding: 20px;">لا توجد نتائج بعد | No results yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Test configuration - DRY principle
        const testConfig = {
            baseUrl: 'http://127.0.0.1:8000',
            adminCredentials: {
                email: 'admin@laravel-brive.com',
                password: 'admin123'
            },
            categories: {
                auth: {
                    icon: '🔐',
                    title: 'المصادقة | Authentication',
                    tests: {
                        login: 'تسجيل دخول الأدمن | Admin Login',
                        logout: 'تسجيل خروج | Logout',
                        profile: 'عرض الملف الشخصي | View Profile',
                        updateProfile: 'تحديث الملف الشخصي | Update Profile'
                    }
                },
                users: {
                    icon: '👥',
                    title: 'إدارة المستخدمين | User Management',
                    tests: {
                        listUsers: 'عرض المستخدمين | List Users',
                        createUser: 'إنشاء مستخدم | Create User',
                        updateUser: 'تحديث مستخدم | Update User',
                        deleteUser: 'حذف مستخدم | Delete User',
                        assignRole: 'تعيين دور | Assign Role'
                    }
                },
                courses: {
                    icon: '📚',
                    title: 'إدارة الدورات | Course Management',
                    tests: {
                        listCourses: 'عرض الدورات | List Courses',
                        createCourse: 'إنشاء دورة | Create Course',
                        updateCourse: 'تحديث دورة | Update Course',
                        deleteCourse: 'حذف دورة | Delete Course',
                        manageLessons: 'إدارة الدروس | Manage Lessons'
                    }
                },
                quizzes: {
                    icon: '📝',
                    title: 'إدارة الاختبارات | Quiz Management',
                    tests: {
                        listQuizzes: 'عرض الاختبارات | List Quizzes',
                        createQuiz: 'إنشاء اختبار | Create Quiz',
                        updateQuiz: 'تحديث اختبار | Update Quiz',
                        deleteQuiz: 'حذف اختبار | Delete Quiz',
                        manageQuestions: 'إدارة الأسئلة | Manage Questions'
                    }
                },
                dashboard: {
                    icon: '📊',
                    title: 'لوحة التحكم | Dashboard',
                    tests: {
                        viewDashboard: 'عرض لوحة التحكم | View Dashboard',
                        getStatistics: 'الحصول على الإحصائيات | Get Statistics',
                        exportData: 'تصدير البيانات | Export Data',
                        systemHealth: 'فحص النظام | System Health'
                    }
                },
                api: {
                    icon: '🔌',
                    title: 'واجهة برمجة التطبيقات | API Testing',
                    tests: {
                        apiAuth: 'مصادقة API | API Authentication',
                        apiUsers: 'API المستخدمين | Users API',
                        apiCourses: 'API الدورات | Courses API',
                        apiQuizzes: 'API الاختبارات | Quizzes API'
                    }
                }
            }
        };

        // Global state management
        let testResults = [];
        let authToken = null;
        let testStats = { total: 0, passed: 0, failed: 0, running: 0 };

        // Initialize testing suite
        function initTestingSuite() {
            renderTestCategories();
            updateStats();
        }

        // Render test categories dynamically - DRY principle
        function renderTestCategories() {
            const container = document.getElementById('testCategories');
            container.innerHTML = '';
            
            Object.entries(testConfig.categories).forEach(([categoryKey, category]) => {
                const categoryDiv = createCategoryElement(categoryKey, category);
                container.appendChild(categoryDiv);
            });
            
            // Update total tests count
            testStats.total = Object.values(testConfig.categories)
                .reduce((total, category) => total + Object.keys(category.tests).length, 0);
            updateStats();
        }

        // Create category element - DRY principle
        function createCategoryElement(categoryKey, category) {
            const div = document.createElement('div');
            div.className = 'test-category';
            
            div.innerHTML = `
                <div class="category-header">
                    <span class="category-icon">${category.icon}</span>
                    <span class="category-title">${category.title}</span>
                </div>
                ${Object.entries(category.tests).map(([testKey, testName]) => `
                    <div class="test-item">
                        <span class="test-name">${testName}</span>
                        <button class="test-btn" onclick="runSingleTest('${categoryKey}', '${testKey}')" id="btn-${categoryKey}-${testKey}">
                            اختبار | Test
                        </button>
                    </div>
                `).join('')}
            `;
            
            return div;
        }

        // Run all tests sequentially
        async function runAllTests() {
            const runAllBtn = document.querySelector('.run-all-btn');
            runAllBtn.innerHTML = '<span class="loading"></span> جاري التشغيل... | Running...';
            runAllBtn.disabled = true;
            
            clearResults();
            let completedTests = 0;
            
            for (const [categoryKey, category] of Object.entries(testConfig.categories)) {
                for (const testKey of Object.keys(category.tests)) {
                    await runSingleTest(categoryKey, testKey);
                    completedTests++;
                    updateProgressBar((completedTests / testStats.total) * 100);
                    await delay(500); // Small delay between tests
                }
            }
            
            runAllBtn.innerHTML = '🚀 تشغيل جميع الاختبارات | Run All Tests';
            runAllBtn.disabled = false;
            updateProgressBar(100);
        }

        // Run single test
        async function runSingleTest(categoryKey, testKey) {
            const btnId = `btn-${categoryKey}-${testKey}`;
            const btn = document.getElementById(btnId);
            const testName = testConfig.categories[categoryKey].tests[testKey];
            
            // Update button state
            btn.className = 'test-btn testing';
            btn.innerHTML = '<span class="loading"></span>';
            btn.disabled = true;
            
            testStats.running++;
            updateStats();
            
            try {
                const result = await executeTest(categoryKey, testKey);
                
                if (result.success) {
                    btn.className = 'test-btn success';
                    btn.innerHTML = '✅';
                    testStats.passed++;
                    addResult(testName, 'نجح الاختبار | Test passed', 'success');
                } else {
                    btn.className = 'test-btn error';
                    btn.innerHTML = '❌';
                    testStats.failed++;
                    addResult(testName, result.error || 'فشل الاختبار | Test failed', 'error');
                }
            } catch (error) {
                btn.className = 'test-btn error';
                btn.innerHTML = '❌';
                testStats.failed++;
                addResult(testName, `خطأ: ${error.message} | Error: ${error.message}`, 'error');
            }
            
            testStats.running--;
            btn.disabled = false;
            updateStats();
        }

        // Execute individual test based on category and test type
        async function executeTest(categoryKey, testKey) {
            const testFunction = `test_${categoryKey}_${testKey}`;
            
            if (typeof window[testFunction] === 'function') {
                return await window[testFunction]();
            }
            
            // Default test implementation
            return await defaultTestImplementation(categoryKey, testKey);
        }

        // Default test implementation for demonstration
        async function defaultTestImplementation(categoryKey, testKey) {
            await delay(Math.random() * 2000 + 500); // Simulate API call
            
            // Simulate success/failure (80% success rate)
            const success = Math.random() > 0.2;
            
            return {
                success,
                error: success ? null : `Simulated error for ${categoryKey}.${testKey}`
            };
        }

        // Specific test implementations
        async function test_auth_login() {
            try {
                const response = await fetch(`${testConfig.baseUrl}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(testConfig.adminCredentials)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token || data.access_token;
                    return { success: true };
                }
                
                return { success: false, error: `Login failed: ${response.status}` };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function test_users_listUsers() {
            return await apiTest('/api/users', 'GET');
        }

        async function test_courses_listCourses() {
            return await apiTest('/api/courses', 'GET');
        }

        async function test_quizzes_listQuizzes() {
            return await apiTest('/api/quizzes', 'GET');
        }

        async function test_dashboard_viewDashboard() {
            return await apiTest('/api/dashboard', 'GET');
        }

        // Generic API test helper
        async function apiTest(endpoint, method = 'GET', body = null) {
            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                };
                
                if (authToken) {
                    options.headers['Authorization'] = `Bearer ${authToken}`;
                }
                
                if (body) {
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(`${testConfig.baseUrl}${endpoint}`, options);
                
                return {
                    success: response.ok,
                    error: response.ok ? null : `API Error: ${response.status} ${response.statusText}`
                };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        // Utility functions
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = testStats.total;
            document.getElementById('passedTests').textContent = testStats.passed;
            document.getElementById('failedTests').textContent = testStats.failed;
            document.getElementById('runningTests').textContent = testStats.running;
        }

        function updateProgressBar(percentage) {
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function addResult(testName, message, type = 'success') {
            const container = document.getElementById('resultsContainer');
            
            if (testResults.length === 0) {
                container.innerHTML = '';
            }
            
            const resultDiv = document.createElement('div');
            resultDiv.className = `result-item ${type}`;
            resultDiv.innerHTML = `
                <div class="result-timestamp">${new Date().toLocaleString('ar-SA')}</div>
                <div class="result-message"><strong>${testName}:</strong> ${message}</div>
            `;
            
            container.insertBefore(resultDiv, container.firstChild);
            testResults.push({ testName, message, type, timestamp: new Date() });
        }

        function clearResults() {
            testResults = [];
            testStats = { total: testStats.total, passed: 0, failed: 0, running: 0 };
            document.getElementById('resultsContainer').innerHTML = '<p style="text-align: center; color: #6c757d; padding: 20px;">لا توجد نتائج بعد | No results yet</p>';
            updateStats();
            updateProgressBar(0);
            
            // Reset all button states
            document.querySelectorAll('.test-btn').forEach(btn => {
                btn.className = 'test-btn';
                btn.innerHTML = 'اختبار | Test';
                btn.disabled = false;
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initTestingSuite);
    </script>
</body>
</html>
