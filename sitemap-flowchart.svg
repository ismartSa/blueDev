<svg width="1400" height="1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 28px; font-weight: bold; fill: #1e3a8a; }
      .section-title { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 20px; font-weight: bold; fill: #1e40af; }
      .page-box { fill: url(#publicGradient); stroke: #2563eb; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .admin-box { fill: url(#adminGradient); stroke: #f59e0b; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .student-box { fill: url(#studentGradient); stroke: #10b981; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .instructor-box { fill: url(#instructorGradient); stroke: #ec4899; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .api-box { fill: url(#apiGradient); stroke: #6b7280; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .planned-box { fill: url(#plannedGradient); stroke: #dc2626; stroke-width: 2; rx: 12; ry: 12; filter: url(#shadow); }
      .page-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; font-weight: 500; fill: #1f2937; text-anchor: middle; }
      .arrow { stroke: #4f46e5; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .legend-box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 8; ry: 8; filter: url(#shadow); }
      .legend-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; fill: #374151; }
      .info-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 11px; fill: #6b7280; }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="publicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adminGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="studentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="instructorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plannedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fee2e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4f46e5" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="700" y="40" class="title" text-anchor="middle">Laravel-Brive Learning Platform - Site Map</text>
  
  <!-- Legend -->
  <g transform="translate(80, 80)">
    <rect x="-20" y="-10" width="1240" height="80" class="legend-box"/>
    <text x="10" y="15" class="section-title">Color Guide:</text>
    <rect x="10" y="25" width="20" height="20" class="page-box"/>
    <text x="40" y="40" class="legend-text">Public Pages</text>
    <rect x="160" y="25" width="20" height="20" class="admin-box"/>
    <text x="190" y="40" class="legend-text">Admin Panel</text>
    <rect x="310" y="25" width="20" height="20" class="student-box"/>
    <text x="340" y="40" class="legend-text">Student Dashboard</text>
    <rect x="460" y="25" width="20" height="20" class="instructor-box"/>
    <text x="490" y="40" class="legend-text">Instructor Panel</text>
    <rect x="610" y="25" width="20" height="20" class="api-box"/>
    <text x="640" y="40" class="legend-text">API Endpoints</text>
    <rect x="760" y="25" width="20" height="20" class="planned-box"/>
    <text x="790" y="40" class="legend-text">Planned Features</text>
  </g>
  
  <!-- Main Entry Point -->
  <rect x="620" y="200" width="160" height="50" class="page-box"/>
  <text x="700" y="230" class="page-text">Home Page (/)</text>
  
  <!-- Authentication Section -->
  <g transform="translate(200, 320)">
    <text x="200" y="20" class="section-title">Authentication System</text>
    <rect x="50" y="40" width="140" height="45" class="page-box"/>
    <text x="120" y="67" class="page-text">Login (/login)</text>
    <rect x="230" y="40" width="140" height="45" class="page-box"/>
    <text x="300" y="67" class="page-text">Register (/register)</text>
  </g>
  
  <!-- Public Course Pages -->
  <g transform="translate(600, 320)">
    <text x="150" y="20" class="section-title">Public Course Pages</text>
    <rect x="50" y="40" width="140" height="45" class="page-box"/>
    <text x="120" y="67" class="page-text">Course List</text>
    <rect x="230" y="40" width="140" height="45" class="page-box"/>
    <text x="300" y="67" class="page-text">Course Details</text>
  </g>
  
  <!-- Dashboard Hub -->
  <rect x="620" y="450" width="160" height="50" class="page-box"/>
  <text x="700" y="480" class="page-text">Dashboard (/dashboard)</text>
  
  <!-- Admin Panel -->
  <g transform="translate(80, 580)">
    <text x="180" y="20" class="section-title">Admin Panel</text>
    <rect x="20" y="40" width="120" height="40" class="admin-box"/>
    <text x="80" y="64" class="page-text">User Management</text>
    <rect x="160" y="40" width="120" height="40" class="admin-box"/>
    <text x="220" y="64" class="page-text">Roles & Permissions</text>
    <rect x="300" y="40" width="120" height="40" class="admin-box"/>
    <text x="360" y="64" class="page-text">System Settings</text>
    
    <rect x="20" y="100" width="120" height="40" class="admin-box"/>
    <text x="80" y="124" class="page-text">Course Categories</text>
    <rect x="160" y="100" width="120" height="40" class="admin-box"/>
    <text x="220" y="124" class="page-text">Reports & Analytics</text>
    <rect x="300" y="100" width="120" height="40" class="admin-box"/>
    <text x="360" y="124" class="page-text">System Logs</text>
  </g>
  
  <!-- Student Dashboard -->
  <g transform="translate(520, 580)">
    <text x="180" y="20" class="section-title">Student Dashboard</text>
    <rect x="20" y="40" width="120" height="40" class="student-box"/>
    <text x="80" y="64" class="page-text">My Courses</text>
    <rect x="160" y="40" width="120" height="40" class="student-box"/>
    <text x="220" y="64" class="page-text">Course Progress</text>
    <rect x="300" y="40" width="120" height="40" class="student-box"/>
    <text x="360" y="64" class="page-text">Certificates</text>
    
    <rect x="20" y="100" width="120" height="40" class="student-box"/>
    <text x="80" y="124" class="page-text">Quiz Results</text>
    <rect x="160" y="100" width="120" height="40" class="student-box"/>
    <text x="220" y="124" class="page-text">Messages</text>
    <rect x="300" y="100" width="120" height="40" class="student-box"/>
    <text x="360" y="124" class="page-text">Profile Settings</text>
  </g>
  
  <!-- Instructor Panel -->
  <g transform="translate(960, 580)">
    <text x="180" y="20" class="section-title">Instructor Panel</text>
    <rect x="20" y="40" width="120" height="40" class="instructor-box"/>
    <text x="80" y="64" class="page-text">Create Course</text>
    <rect x="160" y="40" width="120" height="40" class="instructor-box"/>
    <text x="220" y="64" class="page-text">Manage Courses</text>
    <rect x="300" y="40" width="120" height="40" class="instructor-box"/>
    <text x="360" y="64" class="page-text">Course Analytics</text>
    
    <rect x="20" y="100" width="120" height="40" class="instructor-box"/>
    <text x="80" y="124" class="page-text">Student Progress</text>
    <rect x="160" y="100" width="120" height="40" class="instructor-box"/>
    <text x="220" y="124" class="page-text">Quiz Management</text>
    <rect x="300" y="100" width="120" height="40" class="instructor-box"/>
    <text x="360" y="124" class="page-text">Messages</text>
  </g>
  
  <!-- Course Content Pages -->
  <g transform="translate(450, 780)">
    <text x="250" y="20" class="section-title">Course Content</text>
    <rect x="50" y="40" width="120" height="40" class="page-box"/>
    <text x="110" y="64" class="page-text">Course Sections</text>
    <rect x="190" y="40" width="120" height="40" class="page-box"/>
    <text x="250" y="64" class="page-text">Lecture Player</text>
    <rect x="330" y="40" width="120" height="40" class="page-box"/>
    <text x="390" y="64" class="page-text">Video Player</text>
    
    <rect x="50" y="100" width="120" height="40" class="page-box"/>
    <text x="110" y="124" class="page-text">Quiz Interface</text>
    <rect x="190" y="100" width="120" height="40" class="page-box"/>
    <text x="250" y="124" class="page-text">Quiz Results</text>
    <rect x="330" y="100" width="120" height="40" class="page-box"/>
    <text x="390" y="124" class="page-text">Discussion Forum</text>
  </g>
  
  <!-- Quiz Management -->
  <g transform="translate(120, 980)">
    <text x="250" y="20" class="section-title">Quiz System</text>
    <rect x="50" y="40" width="120" height="40" class="page-box"/>
    <text x="110" y="64" class="page-text">Quiz List</text>
    <rect x="190" y="40" width="120" height="40" class="page-box"/>
    <text x="250" y="64" class="page-text">Create Quiz</text>
    <rect x="330" y="40" width="120" height="40" class="page-box"/>
    <text x="390" y="64" class="page-text">Question Bank</text>
    
    <rect x="50" y="100" width="120" height="40" class="page-box"/>
    <text x="110" y="124" class="page-text">Import Questions</text>
    <rect x="190" y="100" width="120" height="40" class="page-box"/>
    <text x="250" y="124" class="page-text">Quiz Reports</text>
    <rect x="330" y="100" width="120" height="40" class="page-box"/>
    <text x="390" y="124" class="page-text">Grade Management</text>
  </g>
  
  <!-- Payment System -->
  <g transform="translate(700, 980)">
    <text x="180" y="20" class="section-title">Payment System (Planned)</text>
    <rect x="50" y="40" width="120" height="40" class="planned-box"/>
    <text x="110" y="64" class="page-text">Payment Gateway</text>
    <rect x="190" y="40" width="120" height="40" class="planned-box"/>
    <text x="250" y="64" class="page-text">Order History</text>
    
    <rect x="50" y="100" width="120" height="40" class="planned-box"/>
    <text x="110" y="124" class="page-text">Invoices</text>
    <rect x="190" y="100" width="120" height="40" class="planned-box"/>
    <text x="250" y="124" class="page-text">Refunds</text>
  </g>
  
  <!-- API Endpoints -->
  <g transform="translate(350, 1180)">
    <text x="350" y="20" class="section-title">API Endpoints</text>
    <rect x="50" y="40" width="140" height="40" class="api-box"/>
    <text x="120" y="64" class="page-text">/api/courses</text>
    <rect x="210" y="40" width="140" height="40" class="api-box"/>
    <text x="280" y="64" class="page-text">/api/quizzes</text>
    <rect x="370" y="40" width="140" height="40" class="api-box"/>
    <text x="440" y="64" class="page-text">/api/users</text>
    <rect x="530" y="40" width="140" height="40" class="api-box"/>
    <text x="600" y="64" class="page-text">/api/progress</text>
  </g>
  
  <!-- Navigation Arrows -->
  <line x1="700" y1="250" x2="700" y2="320" class="arrow"/>
  <line x1="700" y1="250" x2="320" y2="320" class="arrow"/>
  <line x1="700" y1="250" x2="750" y2="320" class="arrow"/>
  
  <line x1="700" y1="410" x2="700" y2="450" class="arrow"/>
  
  <line x1="700" y1="500" x2="260" y2="580" class="arrow"/>
  <line x1="700" y1="500" x2="700" y2="580" class="arrow"/>
  <line x1="700" y1="500" x2="1140" y2="580" class="arrow"/>
  
  <line x1="700" y1="720" x2="700" y2="780" class="arrow"/>
  
  <line x1="600" y1="880" x2="350" y2="980" class="arrow"/>
  <line x1="700" y1="880" x2="850" y2="980" class="arrow"/>
  <line x1="700" y1="1120" x2="700" y2="1180" class="arrow"/>
  
  <!-- Status Indicators -->
  <g transform="translate(80, 1320)">
    <rect x="-20" y="-10" width="400" height="120" class="legend-box"/>
    <text x="10" y="15" class="section-title">Development Status:</text>
    <circle cx="20" cy="35" r="6" fill="#10b981"/>
    <text x="35" y="42" class="legend-text">✅ Completed (75%)</text>
    <circle cx="20" cy="55" r="6" fill="#f59e0b"/>
    <text x="35" y="62" class="legend-text">🔄 In Progress (15%)</text>
    <circle cx="20" cy="75" r="6" fill="#dc2626"/>
    <text x="35" y="82" class="legend-text">❌ Planned (10%)</text>
  </g>
  
  <!-- Technical Stack -->
  <g transform="translate(520, 1320)">
    <rect x="-20" y="-10" width="350" height="120" class="legend-box"/>
    <text x="10" y="15" class="section-title">Technical Stack:</text>
    <text x="10" y="35" class="legend-text">• Backend: Laravel 11 + PHP 8.3</text>
    <text x="10" y="50" class="legend-text">• Frontend: Vue.js 3 + Inertia.js</text>
    <text x="10" y="65" class="legend-text">• Styling: Tailwind CSS</text>
    <text x="10" y="80" class="legend-text">• Database: MySQL</text>
    <text x="10" y="95" class="legend-text">• Authentication: Laravel Sanctum</text>
  </g>
  
  <!-- Key Features -->
  <g transform="translate(920, 1320)">
    <rect x="-20" y="-10" width="380" height="120" class="legend-box"/>
    <text x="10" y="15" class="section-title">Key Features:</text>
    <text x="10" y="35" class="legend-text">• Course Management System</text>
    <text x="10" y="50" class="legend-text">• Advanced Video Player</text>
    <text x="10" y="65" class="legend-text">• Quiz & Assessment Engine</text>
    <text x="10" y="80" class="legend-text">• Progress Tracking</text>
    <text x="10" y="95" class="legend-text">• Role-based Access Control</text>
  </g>
  
  <!-- Footer -->
  <text x="700" y="1500" class="page-text" text-anchor="middle">Laravel-Brive Learning Management System - Site Architecture</text>
  <text x="700" y="1520" class="info-text" text-anchor="middle">Generated: 2024 | Version: 2.0</text>
</svg>