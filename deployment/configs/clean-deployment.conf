# SiteeBlue Clean Deployment Configuration
# This file defines settings for clean deployment with dev-tools integration

# Environment configurations
[environments]
production.include_dev_tools=false
production.optimize_level=maximum
production.debug_mode=false
production.cache_config=true

staging.include_dev_tools=true
staging.optimize_level=standard
staging.debug_mode=true
staging.cache_config=false

development.include_dev_tools=true
development.optimize_level=minimal
development.debug_mode=true
development.cache_config=false

# Dev-tools configuration
[dev_tools]
viewers_path=dev-tools/viewers
include_in_staging=true
include_in_production=false
exclude_from_backup=false

# Files to always exclude from deployment
[exclusions]
patterns=[
    "*.log",
    "*.tmp",
    "*.temp",
    "*.bak",
    ".DS_Store",
    "Thumbs.db",
    "node_modules/",
    ".git/",
    "tests/",
    "coverage/"
]

# Backup configuration
[backup]
retention_days=30
compress=true
include_database=true
exclude_large_files=true
max_file_size=100MB

# Performance optimization
[optimization]
composer_flags="--no-dev --optimize-autoloader --no-interaction --prefer-dist"
npm_flags="--production=false"
php_opcache=true
laravel_caching=true

# Health check configuration
[health_check]
endpoint="/"
timeout=30
retries=3
expected_status=200

# Notification settings
[notifications]
enable=true
success_webhook=""
failure_webhook=""
email_notifications=false

# Security settings
[security]
file_permissions=755
storage_permissions=775
owner="www-data:www-data"
remove_sensitive_files=true

# Integration settings
[integration]
use_deployignore=true
respect_gitignore=true
validate_before_deploy=true
rollback_on_failure=true

# Dev-tools viewer files
[dev_tools.viewers]
admin_testing_suite="dev-tools/viewers/admin-testing-suite.html"
unified_viewer="dev-tools/viewers/unified-viewer.html"
report_viewer="dev-tools/viewers/report-viewer.html"
readme="dev-tools/README.md"

# Deployment hooks
[hooks]
pre_deploy=""
post_deploy=""
pre_backup=""
post_backup=""
failure_hook=""

# Logging configuration
[logging]
level=info
file="deployment/logs/clean-deployment.log"
rotate=true
max_size=10MB
max_files=5