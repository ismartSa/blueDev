# Production-Optimized Nginx configuration for SiteeBlue Laravel Application
# Modern HTTP/2 syntax, SSL ready, warnings resolved

# Enable HTTP/2 globally
http2 on;

# HTTP to HTTPS redirect server block
server {
    listen 80;
    server_name 158.101.234.203;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server block for Laravel application
server {
    listen 443 ssl http2;
    listen 8989 ssl http2;  # HTTPS on port 8989
    server_name 158.101.234.203;
    root /home/siteeblue/htdocs/siteeblue.so/public;
    index index.php index.html;

    # Enhanced SSL configuration for production
    ssl_certificate /etc/nginx/ssl-certificates/blue.com.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/blue.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Production logging with enhanced format
    access_log /var/log/nginx/siteeblue_access.log;
    error_log /var/log/nginx/siteeblue_error.log;

    # Enhanced security headers for production
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enhanced Gzip compression for production
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Let's Encrypt challenge
    location ~ /.well-known {
        auth_basic off;
        allow all;
    }

    # Laravel application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Enhanced PHP processing for production
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M; post_max_size=100M; max_execution_time=300; memory_limit=512M";
        try_files $uri =404;
    }

    # Enhanced static assets caching for production
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Enhanced security - deny access to sensitive files
    location ~ /\.(ht|env) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.(git|svn) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /composer\.(json|lock) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /package\.(json|lock) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limiting for API endpoints (production security)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Client max body size for file uploads
    client_max_body_size 100M;
}

# Rate limiting zones (add to main nginx.conf if not present)
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
