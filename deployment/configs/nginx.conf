# Optimized Nginx configuration for SiteeBlue Laravel Application
# Modern HTTP/2 syntax, SSL ready, warnings resolved

# Enable HTTP/2 globally
http2 on;

# Consolidated server block for Laravel application
server {
    listen 80;
    listen 443 ssl;
    listen 8989;       # Allow both HTTP and HTTPS on port 8989
    server_name 158.101.234.203;
    root /home/siteeblue/htdocs/siteeblue.so/public;
    index index.php index.html;

    # SSL configuration (stapling removed to eliminate warnings)
    ssl_certificate /etc/nginx/ssl-certificates/blue.com.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/blue.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/siteeblue_access.log;
    error_log /var/log/nginx/siteeblue_error.log;

    # Redirect HTTP to HTTPS for ports 80 and 443 only
    # Port 8989 allows both HTTP and HTTPS without redirect
    set $redirect_https 0;
    if ($scheme = http) {
        set $redirect_https 1;
    }
    if ($server_port = 8989) {
        set $redirect_https 0;
    }
    if ($redirect_https = 1) {
        return 301 https://158.101.234.203$request_uri;
    }

    # Security headers (applied once)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss;

    # Let's Encrypt challenge
    location ~ /.well-known {
        auth_basic off;
        allow all;
    }

    # Laravel application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M; post_max_size=100M; max_execution_time=300; memory_limit=512M";
        try_files $uri =404;
    }

    # Static assets with optimized caching
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\.(ht|env) {
        deny all;
    }

    location ~ /\.(git|svn) {
        deny all;
    }
}
